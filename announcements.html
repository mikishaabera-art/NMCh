<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>የቤተክርስቲያን ማስታወቂያዎች</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f6f8f5;
  color: #26352b;
  margin: 0;
  padding: 20px;
}
header {
  background: #124d32;
  color: white;
  text-align: center;
  padding: 25px 15px;
  border-radius: 10px;
}
.container {
  max-width: 700px;
  margin: 25px auto;
}
.notice {
  background: white;
  padding: 20px;
  margin: 15px 0;
  border-left: 5px solid #d4af37;
  border-radius: 8px;
  box-shadow: 0 2px 8px #0001;
}
h2 { color: #124d32; }
</style>
</head>
<body>

<header>
  <h1>📢 የቤተክርስቲያን ማስታወቂያዎች</h1>
  <p>ነክሪ እናት ቃል ሕይወት ቤተክርስቲያን</p>
</header>

<div class="container">
  <div class="notice">
    <h2>እንኳን ወደ ማስታወቂያ ገጻችን በደህና መጡ!</h2>
    <p>የቤተክርስቲያናችንን አዳዲስ ማስታወቂያዎች፣ የአምልኮ ፕሮግራሞችንና ልዩ ዝግጅቶችን እዚህ ያገኛሉ።</p>
  </div>
</div>

</body>
</html>
